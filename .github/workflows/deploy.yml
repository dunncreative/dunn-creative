name: Deploy to Hostinger

# Pushes to main build the site and upload dist/ to dunncreative.net over FTP.
# Run it by hand (Actions tab, or `gh workflow run deploy.yml`) with
# dry_run=true to test the FTP login and folder without uploading anything.
#
# Repo secrets (Settings > Secrets and variables > Actions > Secrets):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Optional repo variables (same page, Variables tab):
#   FTP_SERVER_DIR  folder the site lives in on the server (default /public_html/)
#   FTP_PORT        default 21
#   FTP_PROTOCOL    ftp (default) or ftps

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test only: log in and list what would upload, change nothing"
        type: boolean
        default: true

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check FTP secrets are set
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All FTP secrets are set."
          echo "Server dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT || 21 }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
          state-name: .ftp-deploy-sync-state.json
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
